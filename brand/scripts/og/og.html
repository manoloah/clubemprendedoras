<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Sans:opsz,wght@9..40,700&family=Fraunces:opsz,wght@9..144,900&display=block">
<style>
  :root { --tomato:#F02717; --pink:#FBC0D7; --butter:#F2C75C; --navy:#17254A; --cream:#F6F0E6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--pink); }
  body { position: relative; font-family: "DM Sans", sans-serif; color: var(--navy); }
  .logo { position: absolute; left: 64px; top: 54px; width: 200px; }
  h1 { position: absolute; left: 64px; top: 214px; width: 620px; font: 900 64px/1.1 "Fraunces", serif; letter-spacing: -0.01em; }
  h1 .accent { color: var(--tomato); }
  .pill { position: absolute; left: 64px; top: 508px; padding: 9px 18px; border-radius: 999px; background: var(--tomato); color: #fff;
          font: 700 17px/1 "DM Sans", sans-serif; letter-spacing: 0.12em; text-transform: uppercase; rotate: -2deg; }
  .art { position: absolute; right: -20px; bottom: -40px; width: 600px; }
  .sticker { position: absolute; left: 722px; top: 444px; padding: 10px 22px 12px; border-radius: 999px; background: var(--butter);
             border: 3px solid var(--navy); font: 700 30px/1 "Caveat", cursive; text-transform: uppercase; rotate: -4deg;
             box-shadow: 0 5px 0 var(--navy); }
</style>
</head>
<body>
  <img class="logo" src="SITE/assets/brand/logo-tomato.webp" alt="">
  <h1>De <span class="accent">cero a emprendedora</span> y a tu ritmo.</h1>
  <p class="pill">Curso grabado · Empieza hoy</p>
  <img class="art" src="SITE/assets/img/club-women.webp" alt="">
  <p class="sticker">Sin ser técnica</p>
</body>
</html>
